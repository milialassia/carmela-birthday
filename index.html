<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 Carmela 13 AÑOS 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            animation: gradientShift 15s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Partículas flotantes */
        .particle {
            position: fixed;
            pointer-events: none;
            font-size: 2rem;
            opacity: 0.7;
            animation: float-particle 6s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes float-particle {
            0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-30px) translateX(20px) rotate(180deg); opacity: 0.3; }
        }

        .particle:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
        .particle:nth-child(2) { top: 20%; right: 8%; animation-delay: 1s; }
        .particle:nth-child(3) { top: 50%; left: 10%; animation-delay: 2s; }
        .particle:nth-child(4) { top: 60%; right: 12%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 80%; left: 15%; animation-delay: 0.5s; }
        .particle:nth-child(6) { top: 30%; right: 20%; animation-delay: 2.5s; }

        /* Contenedor responsive */
        .wrapper {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        .container {
            width: 95%;
            max-width: 900px;
            height: auto;
            max-height: 95vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.25);
            animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Hero Section */
        .hero {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #ffa726 100%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            max-height: 500px;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(1.15) saturate(1.1);
            animation: zoomIn 1s ease-out;
        }

        @keyframes zoomIn {
            from {
                transform: scale(1.1);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.7) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px 25px;
            color: white;
        }

        .hero-title {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 8px;
            animation: slideUp 0.8s ease-out 0.2s both;
            text-shadow: 4px 4px 15px rgba(0, 0, 0, 0.6);
            line-height: 1;
        }

        .hero-subtitle {
            font-size: clamp(1rem, 4vw, 1.8rem);
            font-weight: 300;
            margin-bottom: 12px;
            animation: slideUp 0.8s ease-out 0.3s both;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
        }

        .age-badge {
            display: inline-block;
            background: linear-gradient(135deg, #fff, #ffe0e6);
            color: #f5576c;
            padding: clamp(8px, 2vw, 14px) clamp(16px, 4vw, 28px);
            border-radius: 50px;
            font-size: clamp(1rem, 3vw, 1.3rem);
            font-weight: 800;
            width: fit-content;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.8s ease-out 0.4s both;
            backdrop-filter: blur(10px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Contenido */
        .content {
            padding: clamp(25px, 6vw, 40px);
            background: linear-gradient(135deg, rgba(255,182,193,0.1) 0%, rgba(230,190,255,0.1) 100%);
            overflow-y: auto;
            flex: 1;
        }

        .message {
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            line-height: 1.6;
            animation: fadeIn 0.8s ease-out 0.5s both;
        }

        .message-emoji {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            display: inline-block;
            margin: 0 8px;
            animation: bounce 2s ease-in-out infinite;
        }

        .message-emoji:nth-child(1) { animation-delay: 0s; }
        .message-emoji:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Tarjeta de detalles Premium */
        .details-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 25px;
            padding: clamp(20px, 5vw, 35px);
            margin-bottom: 25px;
            animation: slideUp 0.8s ease-out 0.6s both;
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.25);
            position: relative;
            overflow: hidden;
        }

        .details-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shine 3s infinite;
            pointer-events: none;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%); }
            100% { transform: translateX(100%) translateY(100%); }
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: clamp(12px, 3vw, 18px);
            margin: clamp(12px, 2vw, 18px) 0;
            color: white;
            position: relative;
            z-index: 1;
        }

        .detail-icon {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            flex-shrink: 0;
            animation: float 3s ease-in-out infinite;
        }

        .detail-icon:nth-child(1) { animation-delay: 0s; }
        .detail-icon:nth-child(2) { animation-delay: 0.3s; }
        .detail-icon:nth-child(3) { animation-delay: 0.6s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .detail-text {
            flex: 1;
        }

        .detail-label {
            font-size: clamp(0.75rem, 2vw, 0.9rem);
            opacity: 0.95;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .detail-value {
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-weight: 800;
            margin-top: 5px;
        }

        /* Botones de acción */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(10px, 3vw, 15px);
            margin-bottom: 20px;
            animation: slideUp 0.8s ease-out 0.7s both;
        }

        .btn {
            padding: clamp(12px, 3vw, 18px) clamp(14px, 3vw, 20px);
            border: none;
            border-radius: 18px;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.5s ease;
            z-index: 1;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(245, 87, 108, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #f5576c;
            border: 2px solid #f5576c;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-color: transparent;
            transform: translateY(-5px);
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            color: #999;
            margin-top: 15px;
            animation: slideUp 0.8s ease-out 0.8s both;
        }

        .footer p {
            margin: 8px 0;
        }

        .emoji-decoration {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            animation: float 3s ease-in-out infinite;
            display: inline-block;
            margin: 0 5px;
        }

        .emoji-1 { animation-delay: 0s; }
        .emoji-2 { animation-delay: 0.4s; }
        .emoji-3 { animation-delay: 0.8s; }

        /* Responsive para tablets y desktop */
        @media (min-width: 768px) {
            .action-buttons {
                grid-template-columns: 1fr 1fr;
            }

            .container {
                max-width: 800px;
            }
        }

        @media (min-width: 1024px) {
            .container {
                max-width: 900px;
            }

            .hero {
                aspect-ratio: 16 / 9;
            }
        }

        /* Scroll suave */
        .content {
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 182, 193, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
        }
    </style>
</head>
<body>
    <!-- Partículas flotantes de fondo -->
    <div class="particle">✨</div>
    <div class="particle">💖</div>
    <div class="particle">🦋</div>
    <div class="particle">🎉</div>
    <div class="particle">💕</div>
    <div class="particle">🌸</div>

    <div class="wrapper">
        <div class="container">
            <!-- Hero Section -->
            <div class="hero">
                <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=900&h=600&fit=crop" alt="Carmela 13 años">
                <div class="hero-overlay">
                    <div class="hero-title">CARMELA</div>
                    <div class="hero-subtitle">Cumpleaños 13</div>
                    <div class="age-badge">🎉 13 AÑOS 🎉</div>
                </div>
            </div>

            <!-- Contenido Principal -->
            <div class="content">
                <div class="message">
                    <span class="message-emoji">✨</span>
                    Te invito a compartir conmigo este momento especial
                    <span class="message-emoji">✨</span>
                </div>

                <!-- Tarjeta de Detalles Premium -->
                <div class="details-card">
                    <div class="detail-item">
                        <div class="detail-icon">📅</div>
                        <div class="detail-text">
                            <div class="detail-label">Fecha</div>
                            <div class="detail-value">31 de Octubre 2026</div>
                        </div>
                    </div>

                    <div class="detail-item">
                        <div class="detail-icon">⏰</div>
                        <div class="detail-text">
                            <div class="detail-label">Hora</div>
                            <div class="detail-value">12:30 a 17:00 hs</div>
                        </div>
                    </div>

                    <div class="detail-item">
                        <div class="detail-icon">📍</div>
                        <div class="detail-text">
                            <div class="detail-label">Lugar</div>
                            <div class="detail-value">Complejo La Tatenguita</div>
                        </div>
                    </div>
                </div>

                <!-- Botones de Acción -->
                <div class="action-buttons">
                    <button class="btn btn-primary">✅ Confirmar</button>
                    <button class="btn btn-secondary">💬 Preguntar</button>
                </div>

                <!-- Footer -->
                <div class="footer">
                    <p>
                        <span class="emoji-decoration emoji-1">🦋</span>
                        <span class="emoji-decoration emoji-2">💖</span>
                        <span class="emoji-decoration emoji-3">🦋</span>
                    </p>
                    <p>¡Esperamos tu asistencia! 🎊</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
