<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carmela - Un resumen de mis mejores días</title>
  <style>
    :root { --pink:#f5576c; --purple:#7b5af8; --text:#1e1e1e; --muted:#6f6f6f; --shadow:0 30px 70px rgba(109,58,92,.24); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; color:var(--text); background:linear-gradient(135deg,#ffb1cf,#ffdfe9 30%,#d8c6ff); overflow-x:hidden; }
    @keyframes drift { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-16px) rotate(5deg)} }
    .bg-decor { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .blob { position:absolute; border-radius:50%; filter:blur(12px); opacity:.42; animation:drift 7s ease-in-out infinite; }
    .one { width:320px;height:320px;background:rgba(255,255,255,.55);top:5%;left:8%; }
    .two { width:380px;height:380px;background:rgba(241,129,187,.32);top:56%;right:10%;animation-delay:1s; }
    .three { width:260px;height:260px;background:rgba(174,154,255,.32);bottom:8%;left:28%;animation-delay:2s; }
    .page { position:relative;z-index:1;width:min(100%,1180px);margin:auto;padding:16px 12px 50px; }
    .feed { width:min(100%,880px);margin:auto;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.55);border-radius:32px;overflow:hidden;box-shadow:var(--shadow);backdrop-filter:blur(12px); }
    .header { display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;background:rgba(255,255,255,.25);border-bottom:1px solid rgba(255,255,255,.25); }
    .profile { display:flex;align-items:center;gap:12px;font-weight:800;font-size:.95rem; }
    .avatar { width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#f7bfd7,#b69fff);color:white;font-weight:900;display:grid;place-items:center;box-shadow:0 8px 18px rgba(122,90,248,.25); }
    .actions { display:flex;gap:14px;font-size:1.5rem; }
    .hero { position:relative;width:100%;height:min(68vh,700px);min-height:380px;background:linear-gradient(135deg,#ffb0d1,#f25a7d 42%,#897ef6);overflow:hidden; }
    .hero img { display:block;width:100%;height:100%;object-fit:cover;filter:saturate(1.08) contrast(1.04); }
    .hero-badge { position:absolute;left:18px;bottom:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.34);color:#fff;padding:10px 18px;border-radius:999px;font-size:.85rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(8px); }
    .body { padding:14px 18px 0; }
    .toolbar { display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:1.5rem; }
    .tool-left,.tool-right { display:flex;align-items:center;gap:12px; }
    .likes { font-size:.9rem;font-weight:800;margin:8px 0 3px; }
    .caption { font-size:clamp(.98rem,2vw,1.12rem);line-height:1.6; }
    .caption strong { font-weight:900; }
    .caption .tag { color:#4d46b4;font-weight:800; }
    .details-card { margin:18px 0 0;background:linear-gradient(135deg,#f7b3d5,#f55f7d 50%,#8a7ef7);border-radius:22px;padding:18px 16px;color:#fff;box-shadow:0 16px 26px rgba(125,70,128,.18); }
    .detail-row { display:flex;align-items:center;gap:12px;padding:8px 0; }
    .detail-icon { font-size:1.45rem;min-width:30px; }
    .detail-label { font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.95; }
    .detail-value { font-size:1.02rem;font-weight:800;margin-top:2px; }
    .divider { height:1px;background:rgba(0,0,0,.08);margin:14px 0 8px; }
    .gallery-wrap { padding:0 18px 22px; }
    .gallery-head { display:flex;align-items:center;justify-content:space-between;margin:18px 0 14px;gap:8px; }
    .gallery-title { display:flex;align-items:center;gap:8px;font-size:clamp(1rem,2.2vw,1.2rem);font-weight:900; }
    .gallery-count { color:var(--muted);font-size:.8rem;font-weight:700; }
    .gallery-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px; }
    .photo-card { width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 12px 22px rgba(60,42,76,.12);border:1px solid rgba(255,255,255,.5);background:linear-gradient(135deg,#f9d6e7,#dfd1ff);transition:transform .25s ease,box-shadow .25s ease; }
    .photo-card:hover { transform:translateY(-4px);box-shadow:0 18px 28px rgba(60,42,76,.18); }
    .photo-card img { display:block;width:100%;height:100%;object-fit:cover; }
    .photo-card button { position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:transparent;cursor:zoom-in; }
    .photo-card button:focus-visible { outline:3px solid #fff;outline-offset:-5px; }
    .modal { display:none;position:fixed;inset:0;z-index:5;background:rgba(20,10,25,.86);align-items:center;justify-content:center;padding:20px; }
    .modal.open { display:flex; }
    .modal img { max-width:95vw;max-height:90vh;object-fit:contain;border-radius:16px;box-shadow:0 20px 70px rgba(0,0,0,.5); }
    .modal-close { position:absolute;top:16px;right:20px;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:44px;height:44px;font-size:1.5rem;cursor:pointer; }
    @media(max-width:700px) { .page{padding:10px 8px 30px}.feed{border-radius:18px}.header{padding:12px 14px 8px}.body,.gallery-wrap{padding-left:14px;padding-right:14px}.hero{min-height:320px}.gallery-grid{gap:6px}.photo-card{border-radius:12px}.actions{font-size:1.2rem} }
  </style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true"><div class="blob one"></div><div class="blob two"></div><div class="blob three"></div></div>
  <main class="page">
    <section class="feed">
      <header class="header"><div class="profile"><div class="avatar">C</div><div>carmela</div></div><div class="actions" aria-label="Acciones"><span>◌</span><span>♡</span></div></header>
      <div class="hero"><img src="https://raw.githubusercontent.com/milialassia/carmela-birthday/main/PORTADA.jpeg" alt="Foto de Carmela"><div class="hero-badge">13 años</div></div>
      <div class="body">
        <div class="toolbar"><div class="tool-left"><span>♡</span><span>💬</span><span>✈</span></div><div class="tool-right"><span>🔖</span></div></div>
        <div class="likes">1.234 Me gusta</div>
        <div class="caption"><strong>carmela</strong> Te invito a celebrar conmigo mi cumple! ✨<br>Un resumen de mis mejores días. <span class="tag">#Carmela13</span> <span class="tag">#BestMoments</span></div>
        <div class="details-card">
          <div class="detail-row"><div class="detail-icon">📅</div><div><div class="detail-label">Fecha</div><div class="detail-value">31 de Octubre de 2026</div></div></div>
          <div class="detail-row"><div class="detail-icon">⏰</div><div><div class="detail-label">Hora</div><div class="detail-value">12:30 a 17:00 hs</div></div></div>
          <div class="detail-row"><div class="detail-icon">📍</div><div><div class="detail-label">Lugar</div><div class="detail-value">Complejo Deportivo La Tatenguita</div></div></div>
        </div>
        <div class="divider"></div>
      </div>
      <div class="gallery-wrap">
        <div class="gallery-head"><div class="gallery-title">📷 Un resumen de mis mejores días</div><div class="gallery-count" id="galleryCount">Cargando fotos…</div></div>
        <div class="gallery-grid" id="galleryGrid"></div>
      </div>
    </section>
  </main>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Foto ampliada"><button class="modal-close" id="modalClose" aria-label="Cerrar">×</button><img id="modalImage" alt="Foto ampliada"></div>
  <script>
    const repo='milialassia/carmela-birthday';
    const apiUrl=`https://api.github.com/repos/${repo}/contents`;
    const imagePattern=/\.(jpe?g|png|webp|gif|bmp)$/i;
    const imageUrl=name=>`https://raw.githubusercontent.com/${repo}/main/${encodeURIComponent(name)}`;
    const galleryGrid=document.getElementById('galleryGrid');
    const galleryCount=document.getElementById('galleryCount');
    const modal=document.getElementById('modal');
    const modalImage=document.getElementById('modalImage');

    function openPhoto(src,alt){ modalImage.src=src;modalImage.alt=alt;modal.classList.add('open'); }
    function closePhoto(){ modal.classList.remove('open');modalImage.src=''; }
    document.getElementById('modalClose').addEventListener('click',closePhoto);
    modal.addEventListener('click',event=>{if(event.target===modal)closePhoto();});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closePhoto();});

    async function loadGallery(){
      try {
        const response=await fetch(apiUrl);
        if(!response.ok) throw new Error('GitHub API no disponible');
        const files=await response.json();
        const images=files.filter(file=>file.type==='file'&&imagePattern.test(file.name)&&file.name.toLowerCase()!=='portada.jpeg').sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
        galleryCount.textContent=`${images.length} fotos`;
        if(!images.length){galleryGrid.innerHTML='<p>No se encontraron fotos en el repositorio.</p>';return;}
        // Se muestran todas las fotos cargadas, sin ocultarlas detrás de un botón "+16".
        galleryGrid.innerHTML=images.map((file,index)=>{const src=imageUrl(file.name);const alt=`Foto de Carmela ${index+1}`;return `<div class="photo-card"><img src="${src}" alt="${alt}" loading="lazy"><button type="button" aria-label="Abrir ${alt}" data-src="${src}" data-alt="${alt}"></button></div>`;}).join('');
        galleryGrid.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>openPhoto(button.dataset.src,button.dataset.alt)));
      } catch(error) {
        console.error(error);galleryCount.textContent='Error al cargar';galleryGrid.innerHTML='<p>No se pudieron cargar las fotos. Recargá la página en unos segundos.</p>';
      }
    }
    loadGallery();
  </script>
</body>
</html>
