<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carmela - Un resumen de mis mejores días</title>
  <style>
    :root {
      --bg1: #ff9ec6;
      --bg2: #ffd8ea;
      --bg3: #c9b6ff;
      --pink: #f5576c;
      --pink-dark: #d83d63;
      --purple: #7a5cf2;
      --lavender: #f5d0ff;
      --white: #ffffff;
      --text: #2a2a2a;
      --muted: #6b6b6b;
      --soft: rgba(255,255,255,0.82);
      --shadow: 0 25px 60px rgba(80, 24, 68, 0.23);
      --card-radius: 28px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        linear-gradient(135deg, rgba(255, 158, 198, 0.95), rgba(255, 216, 234, 0.95) 32%, rgba(201, 182, 255, 0.96));
      overflow-x: hidden;
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(4deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .float { animation: drift 6s ease-in-out infinite; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }

    .background-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(12px);
      opacity: 0.35;
    }

    .blob.one {
      width: 300px; height: 300px; background: rgba(255,255,255,0.55);
      top: 10%; left: 8%;
    }
    .blob.two {
      width: 340px; height: 340px; background: rgba(240, 144, 200, 0.45);
      top: 50%; right: 10%;
    }
    .blob.three {
      width: 260px; height: 260px; background: rgba(184, 165, 255, 0.45);
      bottom: 6%; left: 28%;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 1280px);
      margin: 0 auto;
      padding: 24px 18px 50px;
    }

    .feed {
      width: min(100%, 900px);
      margin: 0 auto;
      background: rgba(255,255,255,0.68);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 34px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 12px;
      background: rgba(255,255,255,0.35);
      border-bottom: 1px solid rgba(255,255,255,0.25);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      color: var(--text);
    }

    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, #f9d0dc, #b7a9ff);
      display: grid; place-items: center; color: var(--white); font-size: 1.1rem;
      box-shadow: 0 8px 16px rgba(140, 91, 196, 0.25);
    }

    .actions {
      display: flex; gap: 14px; font-size: 1.5rem;
    }

    .hero {
      position: relative;
      height: min(68vh, 760px);
      min-height: 420px;
      background: linear-gradient(135deg, #ffbdd8, #f57ebe 45%, #b29bff 100%);
      overflow: hidden;
    }

    .hero img {
      display: block; width: 100%; height: 100%; object-fit: cover;
      filter: saturate(1.05) contrast(1.05);
    }

    .hero-badge {
      position: absolute;
      left: 18px; bottom: 18px;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
      color: white;
      padding: 14px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.32);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      box-shadow: 0 12px 25px rgba(0,0,0,0.18);
    }

    .post-body {
      padding: 16px 18px 0;
    }

    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin: 2px 0 14px;
      font-size: 1.45rem;
    }

    .tool-left, .tool-right {
      display: flex; align-items: center; gap: 12px;
    }

    .likes {
      font-weight: 700; margin: 8px 0 2px; font-size: 0.98rem;
    }

    .caption {
      font-size: clamp(0.98rem, 2vw, 1.12rem);
      line-height: 1.6;
      color: var(--text);
    }

    .caption strong {
      font-weight: 800;
    }

    .caption .tag {
      color: #5a4ecf; font-weight: 700;
    }

    .divider {
      height: 1px; background: rgba(0,0,0,0.08); margin: 18px 0 8px;
    }

    .gallery-wrap {
      padding: 0 18px 22px;
    }

    .gallery-header {
      display: flex; align-items: center; justify-content: space-between;
      margin: 18px 0 16px;
      gap: 10px;
    }

    .gallery-title {
      display: flex; align-items: center; gap: 8px;
      font-weight: 800;
      font-size: clamp(1rem, 2.4vw, 1.25rem);
    }

    .gallery-stats {
      color: var(--muted); font-size: 0.88rem; font-weight: 600;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .photo-card {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #f8d6e7, #d4cbff);
      box-shadow: 0 12px 22px rgba(83, 50, 94, 0.12);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .photo-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 18px 28px rgba(83, 50, 94, 0.18);
    }

    .photo-card img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    .photo-card.more {
      background: linear-gradient(135deg, rgba(245,87,108,0.92), rgba(122,92,242,0.9));
      display: grid; place-items: center; color: white; font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 800;
    }

    .photo-card.more span {
      display: inline-flex; align-items: center; justify-content: center;
      width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
    }

    @media (max-width: 700px) {
      .page { padding: 14px 10px 28px; }
      .feed { border-radius: 20px; }
      .post-header { padding: 12px 14px 8px; }
      .profile { font-size: 0.92rem; }
      .hero { min-height: 300px; }
      .toolbar { font-size: 1.2rem; }
      .post-body, .gallery-wrap { padding-left: 14px; padding-right: 14px; }
      .gallery-grid { gap: 6px; }
      .photo-card { border-radius: 12px; }
    }
  </style>
</head>
<body>
  <div class="background-decor" aria-hidden="true">
    <div class="blob one float"></div>
    <div class="blob two float"></div>
    <div class="blob three float"></div>
  </div>

  <div class="page">
    <div class="feed">
      <div class="post-header">
        <div class="profile">
          <div class="avatar pulse">C</div>
          <div>carmela</div>
        </div>
        <div class="actions" aria-label="Acciones">
          <span>◌</span>
          <span>♡</span>
        </div>
      </div>

      <div class="hero">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=1200&q=80" alt="Foto de Carmela" />
        <div class="hero-badge">13 años</div>
      </div>

      <div class="post-body">
        <div class="toolbar">
          <div class="tool-left">
            <span>♡</span>
            <span>💬</span>
            <span>✈</span>
          </div>
          <div class="tool-right">
            <span>🔖</span>
          </div>
        </div>

        <div class="likes">1.234 Me gusta</div>
        <div class="caption">
          <strong>carmela</strong> Un resumen de mis mejores días. <span class="tag">#Carmela13</span> <span class="tag">#BestMoments</span>
        </div>

        <div class="divider"></div>
      </div>

      <div class="gallery-wrap">
        <div class="gallery-header">
          <div class="gallery-title">📷 Récord de momentos</div>
          <div class="gallery-stats">26 fotos</div>
        </div>

        <div class="gallery-grid">
          <div class="photo-card"><img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=800&q=80" alt="Foto 1" /></div>
          <div class="photo-card"><img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=800&q=80" alt="Foto 2" /></div>
          <div class="photo-card"><img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=800&q=80" alt="Foto 3" /></div>
          <div class="photo-card"><img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=800&q=80" alt="Foto 4" /></div>
          <div class="photo-card"><img src="https://images.unsplash.com/photo-1521119989659-a83eee488004?auto=format&fit=crop&w=800&q=80" alt="Foto 5" /></div>
          <div class="photo-card"><img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=800&q=80" alt="Foto 6" /></div>
          <div class="photo-card"><img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=800&q=80" alt="Foto 7" /></div>
          <div class="photo-card"><img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=800&q=80" alt="Foto 8" /></div>
          <div class="photo-card more"><span>+17</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
