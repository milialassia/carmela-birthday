<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 Cumpleaños Carmela - 13 AÑOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
        }

        /* Animaciones */
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Contenedor principal (tipo portada) */
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            animation: slideInDown 0.8s ease-out;
        }

        /* Hero section con foto */
        .hero {
            position: relative;
            height: 600px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(1.1);
        }

        /* Overlay con información */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.6) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px 20px;
            color: white;
            z-index: 2;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin-bottom: 10px;
            animation: slideInUp 1s ease-out;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.5);
        }

        .hero-subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 15px;
            animation: slideInUp 1.2s ease-out;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .age-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.95);
            color: #f5576c;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            width: fit-content;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            animation: slideInUp 1.4s ease-out;
        }

        /* Contenido principal */
        .content {
            padding: 40px 30px;
            background: white;
            animation: slideInUp 0.8s ease-out;
        }

        .message {
            font-size: 1.4rem;
            color: #333;
            text-align: center;
            margin-bottom: 35px;
            font-weight: 600;
            line-height: 1.6;
            animation: slideInUp 1s ease-out;
        }

        .message-emoji {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 15px;
        }

        /* Tarjeta de detalles */
        .details-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            animation: slideInUp 1.2s ease-out;
        }

        .detail-item {
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: white;
            gap: 15px;
        }

        .detail-icon {
            font-size: 2rem;
            min-width: 40px;
        }

        .detail-text {
            flex: 1;
        }

        .detail-label {
            font-size: 0.85rem;
            opacity: 0.9;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .detail-value {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 5px;
        }

        /* Botones de acción */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            animation: slideInUp 1.4s ease-out;
        }

        .btn {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.5);
        }

        .btn-secondary {
            background: white;
            color: #f5576c;
            border: 2px solid #f5576c;
        }

        .btn-secondary:hover {
            background: #f5576c;
            color: white;
            transform: translateY(-3px);
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.95rem;
            color: #999;
            margin-top: 20px;
            animation: slideInUp 1.6s ease-out;
        }

        .footer p {
            margin: 10px 0;
        }

        .emoji-decoration {
            font-size: 2rem;
            animation: float 3s ease-in-out infinite;
            display: inline-block;
            margin: 0 5px;
        }

        .emoji-1 { animation-delay: 0s; }
        .emoji-2 { animation-delay: 0.5s; }
        .emoji-3 { animation-delay: 1s; }

        /* Responsive */
        @media (max-width: 500px) {
            .container {
                border-radius: 20px;
            }

            .hero {
                height: 500px;
            }

            .hero-title {
                font-size: 2.8rem;
            }

            .hero-subtitle {
                font-size: 1.2rem;
            }

            .content {
                padding: 30px 20px;
            }

            .message {
                font-size: 1.2rem;
            }

            .details-card {
                padding: 20px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }

        /* Efecto de brillo */
        .shine {
            position: relative;
            overflow: hidden;
        }

        .shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Hero Section con Foto -->
        <div class="hero">
            <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=500&h=600&fit=crop" alt="Carmela">
            <div class="hero-overlay">
                <div class="hero-title">CARMELA</div>
                <div class="hero-subtitle">Cumpleaños 13</div>
                <div class="age-badge">🎉 13 AÑOS 🎉</div>
            </div>
        </div>

        <!-- Contenido -->
        <div class="content">
            <div class="message">
                <span class="message-emoji">✨</span>
                Te invito a compartir conmigo este momento especial
                <span class="message-emoji">✨</span>
            </div>

            <!-- Tarjeta de detalles -->
            <div class="details-card shine">
                <div class="detail-item">
                    <div class="detail-icon">📅</div>
                    <div class="detail-text">
                        <div class="detail-label">Fecha</div>
                        <div class="detail-value">31 de Octubre</div>
                    </div>
                </div>

                <div class="detail-item">
                    <div class="detail-icon">⏰</div>
                    <div class="detail-text">
                        <div class="detail-label">Hora</div>
                        <div class="detail-value">12:30 a 17:00 hs</div>
                    </div>
                </div>

                <div class="detail-item">
                    <div class="detail-icon">📍</div>
                    <div class="detail-text">
                        <div class="detail-label">Lugar</div>
                        <div class="detail-value">La Tatenguita</div>
                    </div>
                </div>
            </div>

            <!-- Botones de acción -->
            <div class="action-buttons">
                <button class="btn btn-primary">✅ CONFIRMAR</button>
                <button class="btn btn-secondary">💬 PREGUNTAR</button>
            </div>

            <!-- Footer -->
            <div class="footer">
                <p>
                    <span class="emoji-decoration emoji-1">🦋</span>
                    <span class="emoji-decoration emoji-2">💖</span>
                    <span class="emoji-decoration emoji-3">🦋</span>
                </p>
                <p>¡Esperamos tu asistencia! 🎊</p>
            </div>
        </div>
    </div>
</body>
</html>
