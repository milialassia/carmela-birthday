<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carmela - Un resumen de mis mejores días</title>
  <style>
    :root {
      --bg1: #ffb1cf;
      --bg2: #ffdfe9;
      --bg3: #d8c6ff;
      --pink: #f5576c;
      --pink-dark: #d73959;
      --purple: #7b5af8;
      --white: #fff;
      --text: #1e1e1e;
      --muted: #6f6f6f;
      --soft: rgba(255,255,255,0.65);
      --shadow: 0 30px 70px rgba(109, 58, 92, 0.24);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, rgba(255, 177, 207, 0.95), rgba(255, 223, 233, 0.96) 30%, rgba(216, 198, 255, 0.95));
      color: var(--text);
      overflow-x: hidden;
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(5deg); }
    }

    .float { animation: drift 7s ease-in-out infinite; }

    .bg-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(12px);
      opacity: 0.42;
    }

    .blob.one {
      width: 320px; height: 320px; background: rgba(255,255,255,0.55);
      top: 5%; left: 8%;
    }
    .blob.two {
      width: 380px; height: 380px; background: rgba(241, 129, 187, 0.32);
      top: 56%; right: 10%;
    }
    .blob.three {
      width: 260px; height: 260px; background: rgba(174, 154, 255, 0.32);
      bottom: 8%; left: 28%;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: 16px 12px 50px;
    }

    .feed {
      width: min(100%, 880px);
      margin: 0 auto;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 32px;
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 12px;
      background: rgba(255,255,255,0.25);
      border-bottom: 1px solid rgba(255,255,255,0.25);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 0.95rem;
    }

    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, #f7bfd7, #b69fff);
      color: white; font-weight: 900;
      display: grid; place-items: center;
      box-shadow: 0 8px 18px rgba(122, 90, 248, 0.25);
    }

    .actions {
      display: flex; align-items: center; gap: 14px;
      font-size: 1.5rem;
    }

    .hero {
      position: relative;
      width: 100%;
      height: min(68vh, 700px);
      min-height: 380px;
      background: linear-gradient(135deg, #ffb0d1, #f25a7d 42%, #897ef6 100%);
      overflow: hidden;
    }

    .hero img {
      display: block; width: 100%; height: 100%; object-fit: cover;
      filter: saturate(1.08) contrast(1.04);
    }

    .hero-badge {
      position: absolute;
      left: 18px; bottom: 18px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.34);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      box-shadow: 0 14px 28px rgba(0,0,0,0.16);
    }

    .body {
      padding: 14px 18px 0;
    }

    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
      font-size: 1.5rem;
    }

    .tool-left, .tool-right {
      display: flex; align-items: center; gap: 12px;
    }

    .likes {
      font-size: 0.9rem; font-weight: 800; margin: 8px 0 3px;
    }

    .caption {
      font-size: clamp(0.98rem, 2vw, 1.12rem);
      line-height: 1.6;
      color: var(--text);
    }

    .caption strong { font-weight: 900; }
    .caption .tag { color: #4d46b4; font-weight: 800; }

    .details-card {
      margin: 18px 0 0;
      background: linear-gradient(135deg, #f7b3d5 0%, #f55f7d 50%, #8a7ef7 100%);
      border-radius: 22px;
      padding: 18px 16px;
      color: white;
      box-shadow: 0 16px 26px rgba(125, 70, 128, 0.18);
    }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
    }

    .detail-icon { font-size: 1.45rem; min-width: 30px; }
    .detail-label {
      font-size: 0.72rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.95;
    }
    .detail-value {
      font-size: 1.02rem; font-weight: 800; margin-top: 2px;
    }

    .divider {
      height: 1px; background: rgba(0,0,0,0.08); margin: 14px 0 8px;
    }

    .gallery-wrap {
      padding: 0 18px 22px;
    }

    .gallery-head {
      display: flex; align-items: center; justify-content: space-between;
      margin: 18px 0 14px;
      gap: 8px;
    }

    .gallery-title {
      display: flex; align-items: center; gap: 8px;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      font-weight: 900;
    }

    .gallery-count {
      color: var(--muted);
      font-size: 0.8rem; font-weight: 700;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .photo-card {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 12px 22px rgba(60, 42, 76, 0.12);
      border: 1px solid rgba(255,255,255,0.5);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      background: linear-gradient(135deg, #f9d6e7, #dfd1ff);
    }

    .photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 28px rgba(60, 42, 76, 0.18);
    }

    .photo-card img {
      display: block;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .photo-card.more {
      display: grid; place-items: center;
      background: linear-gradient(135deg, rgba(245,87,108,1), rgba(123,90,248,0.95));
      color: white; font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 900;
      text-align: center;
      letter-spacing: 0.04em;
    }

    .photo-card.more .more-badge {
      width: 58px; height: 58px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
    }

    @media (max-width: 700px) {
      .page { padding: 10px 8px 30px; }
      .feed { border-radius: 18px; }
      .header { padding: 12px 14px 8px; }
      .body, .gallery-wrap { padding-left: 14px; padding-right: 14px; }
      .hero { min-height: 320px; }
      .gallery-grid { gap: 6px; }
      .photo-card { border-radius: 12px; }
      .actions { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <div class="blob one float"></div>
    <div class="blob two float"></div>
    <div class="blob three float"></div>
  </div>

  <div class="page">
    <div class="feed">
      <div class="header">
        <div class="profile">
          <div class="avatar">C</div>
          <div>carmela</div>
        </div>
        <div class="actions" aria-label="Acciones">
          <span>◌</span>
          <span>♡</span>
        </div>
      </div>

      <div class="hero">
        <img id="heroImage" src="https://raw.githubusercontent.com/milialassia/carmela-birthday/main/PORTADA.jpeg" alt="Carmela" />
        <div class="hero-badge">13 años</div>
      </div>

      <div class="body">
        <div class="toolbar">
          <div class="tool-left">
            <span>♡</span>
            <span>💬</span>
            <span>✈</span>
          </div>
          <div class="tool-right">
            <span>🔖</span>
          </div>
        </div>

        <div class="likes">1.234 Me gusta</div>
        <div class="caption">
          <strong>carmela</strong> Un resumen de mis mejores días. <span class="tag">#Carmela13</span> <span class="tag">#BestMoments</span>
        </div>

        <div class="details-card">
          <div class="detail-row">
            <div class="detail-icon">📅</div>
            <div>
              <div class="detail-label">Fecha</div>
              <div class="detail-value">31 de Octubre de 2026</div>
            </div>
          </div>
          <div class="detail-row">
            <div class="detail-icon">⏰</div>
            <div>
              <div class="detail-label">Hora</div>
              <div class="detail-value">12:30 a 17:00 hs</div>
            </div>
          </div>
          <div class="detail-row">
            <div class="detail-icon">📍</div>
            <div>
              <div class="detail-label">Lugar</div>
              <div class="detail-value">Complejo Deportivo La Tatenguita</div>
            </div>
          </div>
        </div>

        <div class="divider"></div>
      </div>

      <div class="gallery-wrap">
        <div class="gallery-head">
          <div class="gallery-title">📷 Un resumen de mis mejores días</div>
          <div class="gallery-count" id="galleryCount">0 fotos</div>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
      </div>
    </div>
  </div>

  <script>
    const repo = 'milialassia/carmela-birthday';
    const apiUrl = `https://api.github.com/repos/${repo}/contents`;

    function isImageFile(name) {
      return /\.(jpe?g|png|webp|gif|bmp)$/i.test(name);
    }

    async function loadGallery() {
      try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error('No se pudo cargar la galería');
        const files = await res.json();

        const images = (Array.isArray(files) ? files : [])
          .filter(file => file.type === 'file' && isImageFile(file.name))
          .filter(file => file.name.toLowerCase() !== 'portada.jpeg')
          .map(file => `https://raw.githubusercontent.com/${repo}/main/${encodeURIComponent(file.name)}`)
          .filter(Boolean);

        const galleryGrid = document.getElementById('galleryGrid');
        const galleryCount = document.getElementById('galleryCount');

        if (!galleryGrid) return;

        const items = images.slice(0, 8);
        galleryCount.textContent = `${images.length} fotos`;

        if (items.length === 0) {
          galleryGrid.innerHTML = '<div class="photo-card more"><div class="more-badge">+</div></div>';
          return;
        }

        galleryGrid.innerHTML = items.map((src, i) => {
          if (i === 8 - 1 && images.length > 8) {
            return `<div class="photo-card more"><div class="more-badge">+${images.length - 8}</div></div>`;
          }
          return `<div class="photo-card"><img src="${src}" alt="Foto de Carmela ${i + 1}" loading="lazy" /></div>`;
        }).join('');

      } catch (error) {
        console.error(error);
      }
    }

    loadGallery();
  </script>
</body>
</html>
